[secrets]
    # Service-account tokens live in a personal vault that the ambient service
    # account cannot read, so reads are pinned to this account and go through
    # the 1Password desktop app integration.
    account = "iaiteam.1password.com"

    # Keychain service name -> op:// reference. Every entry is stored under the
    # Keychain account `op-service-account` by
    # run_after_90_keychain-op-service-accounts, and read back by the matching
    # repo's .envrc.
    [secrets.service_account_tokens]
        "1password-iai-explorer-dev" = "op://Employee/1Password SA - Omair Claude Code/credential"
